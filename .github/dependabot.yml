# Dependabot for the ADLC repo itself: only GitHub Actions, including the shared adlc*.yml workflows
# that other repos call (see templates/github/dependabot.yml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
