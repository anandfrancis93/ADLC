# ADLC tier for Dependabot PRs, shared. Repos call it from the .github/workflows/adlc-dependabot.yml
# that `adlc.py sync` writes, on pull_request_target. See docs/sync.md.
# Patch and minor version updates are T1, majors are T2, whatever paths they touch.
# It also posts the commit status adlc / t3-approval that each repo requires. No Dependabot PR is T3, so it passes.
# The caller uses pull_request_target because Dependabot's pull_request token is read-only.
# This workflow never checks out or runs the PR's code.
name: ADLC Dependabot tier

on:
  workflow_call:

permissions:
  pull-requests: write
  issues: write
  statuses: write

jobs:
  tier:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # The tier jobs of adlc.yml and adlc-review.yml skip Dependabot PRs, so this job posts the status.
      - name: Report that Dependabot PRs need no owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f context="adlc / t3-approval" -f state=success \
            -f description="Dependabot: no owner approval needed." -f target_url="$RUN_URL" > /dev/null
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          UPDATE: ${{ steps.meta.outputs.update-type }}
        run: |
          case "$UPDATE" in
            version-update:semver-patch|version-update:semver-minor) tier=T1 ;;
            version-update:semver-major) tier=T2 ;;
            # Empty when the PR has commits not made by Dependabot: tier it by hand.
            *) echo "Cannot tier this PR from Dependabot metadata ('$UPDATE'); set adlc:T* by hand." >&2; exit 1 ;;
          esac
          echo "Dependabot $UPDATE: $tier" >> "$GITHUB_STEP_SUMMARY"
          for t in T1 T2 T3; do gh label create "adlc:$t" --repo "$REPO" --force >/dev/null; done
          gh pr edit "$PR" --repo "$REPO" --remove-label adlc:T1,adlc:T2,adlc:T3 --add-label "adlc:$tier"
