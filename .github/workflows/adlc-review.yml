# ADLC checks on reviews and label changes, shared. Repos call this workflow from the
# .github/workflows/adlc-review.yml that `adlc.py sync` writes. See docs/sync.md.
# It re-checks the T3 approval after a review or a label change, and counts agent review rounds.
# The caller's job id is "adlc" in both callers, so t3-approval here reports under the
# same check name as in adlc.yml. The other required checks run only in adlc.yml.
name: ADLC review

on:
  workflow_call:
    inputs:
      owner:
        description: GitHub login that approves T3 changes (the caller passes vars.ADLC_OWNER).
        type: string
        default: ""
      reviewers:
        description: Comma-separated logins of agent reviewers (the caller passes vars.ADLC_REVIEWERS).
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  tier:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tier
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tier=$(git diff --name-only "$BASE...$HEAD" | python3 .adlc/scripts/adlc.py tier --explain)
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Tier: $tier" >> "$GITHUB_STEP_SUMMARY"
      - name: Label the PR with its tier
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          for t in T1 T2 T3 t3-approved; do gh label create "adlc:$t" --force >/dev/null; done
          gh pr edit "$PR" --remove-label adlc:T1,adlc:T2,adlc:T3 --add-label "adlc:$TIER"

  review-budget:
    if: inputs.reviewers != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REVIEWERS: ${{ inputs.reviewers }}
        run: |
          rounds=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            | jq -s 'add' | python3 .adlc/scripts/adlc.py review-rounds --reviewers "$REVIEWERS")
          echo "Agent review rounds: $rounds" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rounds" -ge 2 ]; then
            gh label create adlc:owner-decides --force >/dev/null
            gh pr edit "$PR" --add-label adlc:owner-decides
          fi

  # The owner's approval: the adlc:t3-approved label, added last by the owner's account, or an
  # approving review of the latest commit. GitHub does not let a PR's author approve it, so the
  # label also works on PRs opened from the owner's account. Runs even when tier fails, because
  # a skipped required check counts as passed.
  t3-approval:
    needs: tier
    if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - if: needs.tier.result != 'success'
        run: |
          echo "The tier job did not pass, so the T3 approval cannot be checked." >&2
          exit 1
      - if: needs.tier.outputs.tier == 'T3'
        uses: actions/checkout@v7
      # The commit reached GitHub when its first check suite was created. A label older than that
      # approved an earlier commit.
      - if: needs.tier.outputs.tier == 'T3'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ inputs.owner }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" | jq -s 'add // []' > "$RUNNER_TEMP/reviews.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/events" | jq -s 'add // []' > "$RUNNER_TEMP/events.json"
          since=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/check-suites?per_page=100" \
            --jq '[.check_suites[].created_at] | min // ""')
          python3 -I .adlc/scripts/adlc.py t3-approved --owner "$OWNER" --head "$HEAD" --since "$since" \
            --reviews "$RUNNER_TEMP/reviews.json" --events "$RUNNER_TEMP/events.json"
