# ADLC checks on pull_request_review, shared. Repos call this workflow from the
# .github/workflows/adlc-review.yml that `adlc.py sync` writes. See docs/sync.md.
# It re-checks the T3 approval after a review and counts agent review rounds.
# The caller's job id is "adlc" in both callers, so t3-approval here reports under the
# same check name as in adlc.yml. The other required checks run only in adlc.yml.
name: ADLC review

on:
  workflow_call:
    inputs:
      owner:
        description: GitHub login that approves T3 changes (the caller passes vars.ADLC_OWNER).
        type: string
        default: ""
      reviewers:
        description: Comma-separated logins of agent reviewers (the caller passes vars.ADLC_REVIEWERS).
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  tier:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tier
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tier=$(git diff --name-only "$BASE...$HEAD" | python3 .adlc/scripts/adlc.py tier --explain)
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Tier: $tier" >> "$GITHUB_STEP_SUMMARY"
      - name: Label the PR with its tier
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          for t in T1 T2 T3; do gh label create "adlc:$t" --force >/dev/null; done
          gh pr edit "$PR" --remove-label adlc:T1,adlc:T2,adlc:T3 --add-label "adlc:$TIER"

  review-budget:
    if: inputs.reviewers != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REVIEWERS: ${{ inputs.reviewers }}
        run: |
          rounds=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            | jq -s 'add' | python3 .adlc/scripts/adlc.py review-rounds --reviewers "$REVIEWERS")
          echo "Agent review rounds: $rounds" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rounds" -ge 2 ]; then
            gh label create adlc:owner-decides --force >/dev/null
            gh pr edit "$PR" --add-label adlc:owner-decides
          fi

  t3-approval:
    needs: tier
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - if: needs.tier.outputs.tier == 'T3'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ inputs.owner }}
        run: |
          approved=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" | jq -s 'add' \
            | jq --arg o "$OWNER" --arg h "$HEAD" \
              '[.[] | select((.user.login|ascii_downcase)==($o|ascii_downcase) and .state=="APPROVED" and .commit_id==$h)] | length')
          if [ "$approved" -eq 0 ]; then
            echo "T3 change: needs an approval from $OWNER on commit $HEAD." >&2
            exit 1
          fi
