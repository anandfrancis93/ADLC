# ADLC checks on pull_request, shared. Repos call this workflow from the .github/workflows/adlc.yml
# that `adlc.py sync` writes, pinned to a release tag. It runs in the calling repo: the checkout,
# the scripts in .adlc/scripts and the token are that repo's. The tier job runs the ADLC's own
# adlc.py at this release instead. See docs/sync.md.
# Review and label events run adlc-review.yml instead. A job skipped on those runs would report
# success under the same check name, so no job here runs on them.
# Required checks: checks, a job, and t3-approval, the commit status that the tier job posts.
# The old checks drift, fast-check, secrets, protected and full-test are steps of the checks job,
# under the same names. design-md is a step that never blocks.
# Dependabot PRs get their tier and t3-approval from adlc-dependabot.yml (their pull_request token is read-only).
name: ADLC

on:
  workflow_call:
    inputs:
      owner:
        description: GitHub login that approves T3 changes (the caller passes vars.ADLC_OWNER).
        type: string
        default: ""

# No workflow-level permissions: each job names its own, and the caller's grant caps them.
# A block names the scopes the job gets. Each scope it leaves out is none.
jobs:
  # The tier, its label and the owner's approval, in one job. adlc.yml and adlc-review.yml run the same job.
  # The approval is the commit status "adlc / t3-approval" on the head commit, not the result of this job.
  # A T3 change waits as pending: the run passes, so GitHub sends no failure email, and the merge stays blocked.
  # GitHub counts the latest status of each name, so a label or review event turns it to success with no re-run.
  # When this job fails, its last step posts failure, so a failed tier blocks the merge.
  # This job can write statuses, so it runs no file from the PR, only the ADLC's own adlc.py.
  tier:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      # A re-run keeps the event, so this step runs again on each re-run of a push run. The run's
      # created_at stays the same on a re-run. A label added after that time approved this commit, so the step keeps it.
      # The approval step also ignores a label older than the commit, so this is a second guard.
      - name: Drop the T3 approval label after a new commit
        if: github.event.action == 'synchronize'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          added=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/events" | jq -rs --arg since "$created" '
            [add // [] | .[] | select(.event == "labeled" or .event == "unlabeled")
              | select(.label.name == "adlc:t3-approved")]
            | sort_by(.created_at, .id) | last
            | if . != null and .event == "labeled" and (.created_at | fromdateiso8601) > ($since | fromdateiso8601)
              then .created_at else "" end')
          if [ -n "$added" ]; then
            echo "Kept adlc:t3-approved: it was added at $added, after this run was created at $created."
            exit 0
          fi
          if ! out=$(gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/adlc:t3-approved" 2>&1); then
            case "$out" in *"HTTP 404"*) ;; *) echo "$out" >&2; exit 1 ;; esac
          fi
      # The ADLC at the commit of this workflow, which is the release the caller pins. The drift step holds
      # the repo's .adlc/scripts/adlc.py to the same file. Code of the PR in an earlier step of this job could
      # change each later step through $GITHUB_ENV, $GITHUB_PATH or the runner's files, so no step runs any.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: adlc-release
          persist-credentials: false
      # The PR only as data: the list of changed files, and its .adlc/tiers.
      - uses: actions/checkout@v7
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      # bash with pipefail: a failed git diff must fail the step, not give an empty list (T1).
      # python3 -I: no file of the PR's folder is imported.
      - id: tier
        shell: bash
        working-directory: pr
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tier=$(git diff --name-only "$BASE...$HEAD" | python3 -I ../adlc-release/scripts/adlc.py tier --explain)
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Tier: $tier" >> "$GITHUB_STEP_SUMMARY"
      # Both checkouts are in folders of their own, so the workspace is not a git clone, and gh needs GH_REPO.
      - name: Label the PR with its tier
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          for t in T1 T2 T3 t3-approved; do gh label create "adlc:$t" --force >/dev/null; done
          gh pr edit "$PR" --remove-label adlc:T1,adlc:T2,adlc:T3 --add-label "adlc:$TIER"
      # The owner's approval: the adlc:t3-approved label, added last by the owner's account after the
      # latest commit reached GitHub, or an approving review of the latest commit. GitHub does not let
      # a PR's author approve it, so the label also works on PRs opened from the owner's account.
      # The commit reached GitHub when its first check suite was created. A label older than that
      # approved an earlier commit. So does a label older than the newest force push, which can bring
      # back a commit with older check suites.
      # Two runs on one commit can overlap, such as the run of a push and the run of a label added just after.
      # So after each post, the step reads the approval again, and posts again when it changed.
      - name: Report the owner's approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ inputs.owner }}
          TIER: ${{ steps.tier.outputs.tier }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          posted=""
          for n in 1 2 3 4 5; do
            since=""
            if [ "$TIER" = T3 ]; then
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" | jq -s 'add // []' > "$RUNNER_TEMP/reviews.json"
              gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/events" | jq -s 'add // []' > "$RUNNER_TEMP/events.json"
              since=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/check-suites?per_page=100" \
                --jq '[.check_suites[].created_at] | min // ""')
            fi
            status=$(python3 -I adlc-release/scripts/adlc.py t3-status --tier "$TIER" --owner "$OWNER" --head "$HEAD" \
              --since "$since" --reviews "$RUNNER_TEMP/reviews.json" --events "$RUNNER_TEMP/events.json")
            if [ "$status" = "$posted" ]; then
              exit 0
            fi
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f context="adlc / t3-approval" \
              -f state="$(jq -r .state <<< "$status")" -f description="$(jq -r .description <<< "$status")" \
              -f target_url="$RUN_URL" > /dev/null
            echo "Posted adlc / t3-approval (read $n): $status"
            posted=$status
          done
          echo "::error::The owner's approval changed on each of 5 reads. Add the label again to check it again." >&2
          exit 1
      # Without this step, a success that an earlier run posted on the same commit would stay after an error.
      - name: Block the merge when this job fails
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f context="adlc / t3-approval" -f state=failure \
            -f description="The tier job failed, so the approval was not checked. See the run." \
            -f target_url="$RUN_URL" > /dev/null

  # All the other checks, in one job, because GitHub bills each job as at least one minute.
  # Each step after drift runs also when an earlier step fails, so one run reports every failure.
  # The PR's own code runs in this job (install, fast-check, full-test), so its token can only read.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The files that `adlc.py sync` manages must match this release byte for byte.
      # Their hashes are written below, so a repo cannot change a file and its hash together.
      - name: drift
        run: |
          # BEGIN manifest: generated by `python3 scripts/adlc.py manifest --write`. Do not edit.
          version=0.7.0
          manifest='
          967d9afb101346667166f2e76e81910bc190488d7d41d50ca0072e9d92f00e32 .adlc/version
          ef1f91c1bce218bf1cd7aa5ab1a63abf74b48e83a0604cc10278a68b6aca83df .adlc/scripts/adlc.py
          378599cfc8ee4962b68b511d653d536cf6b848af107a3109e32cae989f9f7d00 .githooks/pre-commit
          a68c3ffe1cbcf9aaabdddb8da9bedea6c11cb9accf09238a737e3d0be292a42f .github/workflows/adlc.yml
          504e5b95f187dacbf2f5bba04518e281345f5fb84b11c99832ffc3f0744e6e63 .github/workflows/adlc-review.yml
          257d5af4e865f213dde18ee1bb5add2bd3173731fa8da80f4d29b27f22c69de9 .github/workflows/adlc-pr-title.yml
          43be5c98e610c530ef3f2064a33608a82e1784cb460286f40426657dd3903359 .github/workflows/adlc-dependabot.yml
          1c526d4650b0ac9a30b77d93dd65a54ce5fd65ce609ae93379e9189d67c3cfab .github/pull_request_template.md
          b520b6889a860080a4258e7db16ebd647020b8f6f9eec651669f9a253e2da071 .github/workflows/adlc-release.yml optional
          '
          # END manifest
          status=0
          while read -r sum path optional; do
            [ -n "$path" ] || continue
            if [ ! -f "$path" ]; then
              [ -n "$optional" ] && continue
              echo "::error file=$path::ADLC $version manages $path, and it is missing."
              status=1
            elif [ "$(sha256sum < "$path" | cut -d' ' -f1)" != "$sum" ]; then
              echo "::error file=$path::$path differs from ADLC $version. Change it in the ADLC repo instead."
              status=1
            fi
          done <<< "$manifest"
          if [ "$status" -ne 0 ]; then
            echo "ADLC: restore these files with adlc.py sync from ADLC v$version (docs/sync.md in the ADLC repo)." >&2
          fi
          exit "$status"
      # Paths in .adlc/protected may not change. Each commit is checked against the list in its parent,
      # so a failing test protected by an earlier commit of this PR is covered. Works with any AI tool.
      - name: protected
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .adlc/scripts/adlc.py protected-changes --base "$BASE" --head "$HEAD"
      # Secret scan of the PR's commits only. Pinned version, checksum verified.
      - name: Install Betterleaks
        id: betterleaks
        if: ${{ !cancelled() }}
        env:
          V: "1.9.0"
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/betterleaks/betterleaks/releases/download/v$V"
          curl -sSfLO "$base/betterleaks_${V}_linux_x64.tar.gz"
          curl -sSfLO "$base/checksums.txt"
          grep " betterleaks_${V}_linux_x64.tar.gz\$" checksums.txt | sha256sum -c -
          mkdir bl && tar -xzf "betterleaks_${V}_linux_x64.tar.gz" -C bl
          echo "$RUNNER_TEMP/bl" >> "$GITHUB_PATH"
      - name: secrets
        if: ${{ !cancelled() && steps.betterleaks.outcome == 'success' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: betterleaks git . --log-opts="$BASE..$HEAD" --redact --no-banner
      # Only for repos with a DESIGN.md at the root. The format is alpha, so the CLI version is pinned.
      # It never blocks a merge, as when it was its own job and not a required check.
      - name: design-md
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ ! -f DESIGN.md ]; then echo "No DESIGN.md; skipping."; exit 0; fi
          npx --yes @google/design.md@0.4.0 lint DESIGN.md \
            || { echo "::warning file=DESIGN.md::The DESIGN.md lint failed. It does not block the merge."; exit 1; }
      - id: node
        if: ${{ !cancelled() && hashFiles('.nvmrc') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: python
        if: ${{ !cancelled() && hashFiles('.python-version') != '' }}
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: install
        id: install
        if: ${{ !cancelled() && steps.node.outcome != 'failure' && steps.python.outcome != 'failure' }}
        run: .adlc/install
      # Formatter check and lint on the PR's changed files. Same script as pre-commit, without writing.
      - name: fast-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ADLC_CHECK_ONLY: "1"
        run: git diff --name-only -z --diff-filter=ACMR "$BASE...$HEAD" | xargs -0 -r .adlc/fast-check
      # The only place the full suite runs. The review caller (adlc-review.yml) does not run it.
      - name: full-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .adlc/full-test
