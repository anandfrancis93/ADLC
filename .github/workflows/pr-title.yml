# PR title check for the ADLC repo itself (same as templates/github/workflows/adlc-pr-title.yml).
name: ADLC PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/adlc.py pr-title "$TITLE"
