# ADLC release, for repos that ship versioned releases. The ADLC manages this file: `adlc.py sync --releases`
# writes it, and the drift check fails if it changes.
# Pushing tag vX.Y.Z creates a GitHub release whose notes are that version's CHANGELOG.md entry.
name: ADLC release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

jobs:
  release:
    uses: anandfrancis93/ADLC/.github/workflows/adlc-release.yml@v{{ADLC_VERSION}}
